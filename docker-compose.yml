version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: irfam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: irfam_db
      POSTGRES_USER: irfam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irfam_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Django + React
  web:
    build: .
    container_name: irfam_app
    command: gunicorn irfam_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
      - ./logs:/var/log/irfam
    ports:
      - "8000:8000"
    env_file:
      - ./irfam_backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx (optionnel - serveur web)
  nginx:
    image: nginx:alpine
    container_name: irfam_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
